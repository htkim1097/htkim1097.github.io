
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>
    
      첫 번째 게시글 | 나의 노트장
    
  </title>

  <meta name="description"
        content="개발과 기술 학습 기록">

  <link rel="stylesheet"
        href="/assets/css/style.css">

  <script>
    (function () {
      const savedTheme = localStorage.getItem("blog-theme");
      const systemDark = window.matchMedia(
        "(prefers-color-scheme: dark)"
      ).matches;

      const theme = savedTheme || (systemDark ? "dark" : "light");

      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
</head>

<body>
  <div class="site-wrapper">

    <header class="site-header">
      <a class="site-title" href="/">
        나의 노트장
      </a>

      <p class="site-description">
        개발과 기술 학습 기록
      </p>

      <nav class="site-nav">
        <a href="/">Home</a>
        <a href="/categories/">카테고리</a>
        <a href="/tags/">태그</a>

        <button
          id="theme-toggle"
          class="theme-toggle"
          type="button"
          aria-label="테마 변경"
        >
          <span id="theme-icon">☾</span>
          <span id="theme-label">다크 모드</span>
        </button>
      </nav>
    </header>

    <main class="site-main">
      <article class="post">

  <header class="post-header">

    <div class="post-meta">
      <time datetime="2026-11-07T14:00:00+09:00">
        2026.11.07
      </time>
    </div>

    <h1 class="post-title">첫 번째 게시글</h1>

    

    
      <div class="post-categories">
        
          <a
            class="category-label"
            href="/categories/#개발"
          >
            개발
          </a>
        
      </div>
    

    
      <div class="post-tags">
        
          <a
            class="tag-label"
            href="/tags/#jekyll"
          >
            #Jekyll
          </a>
        
          <a
            class="tag-label"
            href="/tags/#github"
          >
            #GitHub
          </a>
        
          <a
            class="tag-label"
            href="/tags/#markdown"
          >
            #Markdown
          </a>
        
      </div>
    

  </header>

  <div class="post-content">
    <p>GitHub Pages와 Jekyll을 이용해
나만의 기술 블로그를 구축하고 있다.</p>

<h2 id="테스트-내용">테스트 내용</h2>

<ul>
  <li>Markdown 파일 작성</li>
  <li>Jekyll 게시글 인식</li>
  <li>HTML 변환</li>
  <li>블로그 목록 표시</li>
</ul>

<p>이 게시글은 블로그 동작을 확인하기 위한 테스트 글이다.</p>

  </div>

  <div class="post-navigation">
    <a href="/">
      ← 모든 게시글 보기
    </a>
  </div>

</article>

    </main>

    <footer class="site-footer">
      <p>
        © 2026 HTKIM
      </p>
      <p>Built with Jekyll</p>
    </footer>

  </div>

  <script>
    const themeButton = document.getElementById("theme-toggle");
    const themeIcon = document.getElementById("theme-icon");
    const themeLabel = document.getElementById("theme-label");

    function updateThemeButton(theme) {
      if (theme === "dark") {
        themeIcon.textContent = "☀";
        themeLabel.textContent = "라이트 모드";
      } else {
        themeIcon.textContent = "☾";
        themeLabel.textContent = "다크 모드";
      }
    }

    function setTheme(theme) {
      document.documentElement.setAttribute("data-theme", theme);
      localStorage.setItem("blog-theme", theme);
      updateThemeButton(theme);
    }

    const currentTheme =
      document.documentElement.getAttribute("data-theme") || "light";

    updateThemeButton(currentTheme);

    themeButton.addEventListener("click", function () {
      const current =
        document.documentElement.getAttribute("data-theme");

      setTheme(current === "dark" ? "light" : "dark");
    });
  </script>
</body>
</html>
