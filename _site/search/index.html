
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>
    
      검색 | 나의 노트장
    
  </title>

  <meta name="description"
        content="게시글 검색">

  <link rel="stylesheet"
        href="/assets/css/style.css">

  <script>
    (function () {
      const savedTheme = localStorage.getItem("blog-theme");
      const systemDark = window.matchMedia(
        "(prefers-color-scheme: dark)"
      ).matches;

      const theme = savedTheme || (systemDark ? "dark" : "light");

      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
</head>

<body>
  <div class="site-wrapper">

    <header class="site-header">
      <a class="site-title" href="/">
        나의 노트장
      </a>

      <p class="site-description">
        개발과 기술 학습 기록
      </p>

      <nav class="site-nav">
        <a href="/">Home</a>
        <a href="/categories/">카테고리</a>
        <a href="/tags/">태그</a>
        <a href="/search/">검색</a>

        <button
          id="theme-toggle"
          class="theme-toggle"
          type="button"
          aria-label="테마 변경"
        >
          <span id="theme-icon">☾</span>
          <span id="theme-label">다크 모드</span>
        </button>
      </nav>
    </header>

    <main class="site-main">
      <section class="search-page">

  <header class="archive-header">
    <h1>검색</h1>
    <p>게시글 제목, 본문, 카테고리, 태그를 검색합니다.</p>
  </header>

  <div class="search-box">
    <input type="search" id="search-input" placeholder="검색어를 입력하세요." autocomplete="off" aria-label="게시글 검색" />
  </div>

  <p id="search-status" class="search-status">
    검색어를 입력해 주세요.
  </p>

  <div id="search-results" class="search-results"></div>

</section>

<script src="/assets/js/search.js" defer=""></script>


    </main>

    <footer class="site-footer">
      <p>
        © 2026 HTKIM
      </p>
      <p>Built with Jekyll</p>
    </footer>

  </div>

  <button
    id="back-to-top"
    class="back-to-top"
    type="button"
    aria-label="페이지 상단으로 이동"
  >
    ↑
  </button>

  <script>
    const themeButton = document.getElementById("theme-toggle");
    const themeIcon = document.getElementById("theme-icon");
    const themeLabel = document.getElementById("theme-label");

    function updateThemeButton(theme) {
      if (theme === "dark") {
        themeIcon.textContent = "☀";
        themeLabel.textContent = "라이트 모드";
      } else {
        themeIcon.textContent = "☾";
        themeLabel.textContent = "다크 모드";
      }
    }

    function setTheme(theme) {
      document.documentElement.setAttribute("data-theme", theme);
      localStorage.setItem("blog-theme", theme);
      updateThemeButton(theme);
    }

    const currentTheme =
      document.documentElement.getAttribute("data-theme") || "light";

    updateThemeButton(currentTheme);

    themeButton.addEventListener("click", function () {
      const current =
        document.documentElement.getAttribute("data-theme");

      setTheme(current === "dark" ? "light" : "dark");
    });

    const backToTopButton = document.getElementById("back-to-top");

    window.addEventListener("scroll", () => {
      if (window.scrollY > 400) {
        backToTopButton.classList.add("visible");
      } else {
        backToTopButton.classList.remove("visible");
      }
    });

    backToTopButton.addEventListener("click", () => {
      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    });
  </script>
</body>
</html>
