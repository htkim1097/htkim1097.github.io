
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>
    
      카테고리 | 나의 노트장
    
  </title>

  <meta name="description"
        content="카테고리별 게시글 모음">

  <link rel="stylesheet"
        href="/assets/css/style.css">

  <script>
    (function () {
      const savedTheme = localStorage.getItem("blog-theme");
      const systemDark = window.matchMedia(
        "(prefers-color-scheme: dark)"
      ).matches;

      const theme = savedTheme || (systemDark ? "dark" : "light");

      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
</head>

<body>
  <div class="site-wrapper">

    <header class="site-header">
      <a class="site-title" href="/">
        나의 노트장
      </a>

      <p class="site-description">
        개발과 기술 학습 기록
      </p>

      <nav class="site-nav">
        <a href="/">Home</a>
        <a href="/categories/">카테고리</a>
        <a href="/tags/">태그</a>
        <a href="/search/">검색</a>

        <button
          id="theme-toggle"
          class="theme-toggle"
          type="button"
          aria-label="테마 변경"
        >
          <span id="theme-icon">☾</span>
          <span id="theme-label">다크 모드</span>
        </button>
      </nav>
    </header>

    <main class="site-main">
      <section class="archive-page">

  <header class="archive-header">
    <h1>카테고리</h1>
    <p>주제별로 게시글을 모아봅니다.</p>
  </header>

  
    
    

    <section class="archive-group" id="개발">

      <h2>개발</h2>

      <ul class="archive-post-list">
        
          <li>
            <time>2026.11.08</time>
            <a href="/%EA%B0%9C%EB%B0%9C/2026/11/08/build-jekyll-blog-on-windows/">
              Windows 환경에서 Jekyll과 GitHub Pages로 기술 블로그 구축하기
            </a>
          </li>
        
          <li>
            <time>2026.11.08</time>
            <a href="/%EA%B0%9C%EB%B0%9C/2026/11/08/IT-%EB%85%B8%ED%8A%B8-%EC%A0%95%EB%A6%AC-%ED%8C%81/">
              IT 노트 정리 팁
            </a>
          </li>
        
      </ul>

    </section>
  
    
    

    <section class="archive-group" id="제작">

      <h2>제작</h2>

      <ul class="archive-post-list">
        
          <li>
            <time>2026.11.09</time>
            <a href="/%EC%A0%9C%EC%9E%91/2026/11/09/3d-printed-medicine-divider/">
              3D 프린터로 약상자 정리용 4칸 디바이더 제작하기
            </a>
          </li>
        
      </ul>

    </section>
  

</section>

    </main>

    <footer class="site-footer">
      <p>
        © 2026 HTKIM
      </p>
      <p>Built with Jekyll</p>
    </footer>

  </div>

  <button
    id="back-to-top"
    class="back-to-top"
    type="button"
    aria-label="페이지 상단으로 이동"
  >
    ↑
  </button>

  <script>
    const themeButton = document.getElementById("theme-toggle");
    const themeIcon = document.getElementById("theme-icon");
    const themeLabel = document.getElementById("theme-label");

    function updateThemeButton(theme) {
      if (theme === "dark") {
        themeIcon.textContent = "☀";
        themeLabel.textContent = "라이트 모드";
      } else {
        themeIcon.textContent = "☾";
        themeLabel.textContent = "다크 모드";
      }
    }

    function setTheme(theme) {
      document.documentElement.setAttribute("data-theme", theme);
      localStorage.setItem("blog-theme", theme);
      updateThemeButton(theme);
    }

    const currentTheme =
      document.documentElement.getAttribute("data-theme") || "light";

    updateThemeButton(currentTheme);

    themeButton.addEventListener("click", function () {
      const current =
        document.documentElement.getAttribute("data-theme");

      setTheme(current === "dark" ? "light" : "dark");
    });

    const backToTopButton = document.getElementById("back-to-top");

    window.addEventListener("scroll", () => {
      if (window.scrollY > 400) {
        backToTopButton.classList.add("visible");
      } else {
        backToTopButton.classList.remove("visible");
      }
    });

    backToTopButton.addEventListener("click", () => {
      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    });
  </script>
</body>
</html>
