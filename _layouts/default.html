<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>
    {% if page.title %}
      {{ page.title }} | {{ site.title }}
    {% else %}
      {{ site.title }}
    {% endif %}
  </title>

  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>

<body>
  <header>
    <a href="{{ '/' | relative_url }}">
      {{ site.title }}
    </a>
    <p>{{ site.description }}</p>
  </header>

  <main>
    <!-- 페이지 내용 -->
    {{ content }}  
  </main>

  <footer>
    <p>© {{ site.time | date: "%Y" }} {{ site.author }}</p>
  </footer>
</body>
</html>
