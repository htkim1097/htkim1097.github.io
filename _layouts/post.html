---
layout: default
---

<article>
  <h1>{{ page.title }}</h1>

  <p>
    {{ page.date | date: "%Y-%m-%d" }}
  </p>

  {% if page.categories.size > 0 %}
    <p>
      카테고리:
      {{ page.categories | join: ", " }}
    </p>
  {% endif %}

  <hr>

  <div>
    {{ content }}
  </div>
</article>

<p>
  <a href="{{ '/' | relative_url }}">← 목록으로</a>
</p>
